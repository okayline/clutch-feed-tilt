<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TILT.EXE</title>
<style>
  /* One terminal screen: 4Dungeon's 80-column text frame, with a hi-res ASCII raycast window where the 3D view sits. */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-display: swap; }
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --enemy: #e0564a;
    --gold: #e3b341;
    --ghost: #9fc4ff;
    --mono: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    margin: 0; min-height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
    font-family: var(--mono); font-variant-ligatures: none;
    -webkit-user-select: none; user-select: none;
  }
  /* the same size as 4Dungeon's screen (daily-dungeon index.html pre): 80 columns, filling the width on phones */
  .game { position: relative; font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); max-width: 100%; }
  .game pre { margin: 0; font: inherit; line-height: 1.05; white-space: pre; }
  @media (max-width: 700px) {
    body { padding-left: 4px; padding-right: 4px; }
    .game { font-size: calc((100vw - 8px) / 32.5); }
  }
  .view {
    position: absolute; left: 1ch; top: 3.15em; width: 47ch; height: 17.85em;
    background: var(--bg); overflow: hidden; cursor: none; touch-action: none;
  }
  .view:focus { outline: none; }   /* focused on click so the keys reach the game (app.js); the crosshair shows where you are */
  .view pre { font-size: .5em; }
  .fadein { animation: fadein 1.2s ease-in; }   /* the FEED banner, after FRAGGED fades out (app.js) */
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .view.hurt { box-shadow: inset 0 0 0 .25em var(--enemy); }
  .game.shake { animation: shake .18s linear; }
  @keyframes shake { 25% { transform: translate(3px, -2px) } 50% { transform: translate(-3px, 2px) } 75% { transform: translate(2px, 1px) } }
  @media (prefers-reduced-motion: reduce) { .game.shake { animation: none; } }
  .banner {
    position: absolute; left: 1ch; top: 3.15em; width: 47ch; height: 17.85em;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .banner[hidden] { display: none; }
  .banner pre { background: var(--bg); padding: .3em 0; text-align: left; }
  .d { color: var(--dim); } .t { color: var(--trail); } .b { color: var(--bright); }
  .e { color: var(--enemy); } .g { color: var(--gold); } .h { color: var(--ghost); }
  /* the LEDGER panel, inside the 3D view window */
  .panel { position: absolute; left: 1ch; top: 3.15em; width: 47ch; height: 17.85em; background: var(--bg); box-sizing: border-box;
    outline: 1px solid var(--trail); overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .panel[hidden] { display: none; }
  .panel pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .panel .top { position: sticky; top: 0; background: var(--bg); }
  .btn { cursor: pointer; color: var(--bright); display: inline-block; }
  .btn:hover { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
<div class="game" id="game">
  <pre id="frame"></pre>
  <!-- the footer every game shows (dungeon-items src/footer.js): "🄯 ~*~88x31~*~ · § ≡ version", drawn into this spot; shown once the game has drawn -->
  <div id="ddfoot" hidden></div>
  <script src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v0.20.1"></script>
  <div class="view" id="view" tabindex="-1" aria-label="Click to capture the mouse, then click to shoot. On a phone: drag on the left to walk, drag on the right to turn, tap to shoot"><pre id="screen"></pre></div>
  <div class="banner" id="banner" hidden><pre id="bannerText"></pre></div>
  <div class="panel" id="ledgerPanel" hidden><pre></pre></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
